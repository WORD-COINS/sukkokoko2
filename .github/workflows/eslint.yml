name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4.4.0

      - name: Setup Node.js
        uses: volta-cli/action@v4.2.1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        uses: reviewdog/action-eslint@v1.34.0
        with:
          fail_on_error: true
          eslint_flags: "."
